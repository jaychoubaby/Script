# 国内补充与最终兜底
DOMAIN-SUFFIX,cn,DIRECT
DOMAIN-KEYWORD,-cn,DIRECT
GEOIP,CN,DIRECT
FINAL,Final

[URL Rewrite]
# 如需 g.cn/google.cn 跳转 Google，取消下一行注释，并为相关域名开启 HTTPS 解密
^https?:\/\/(www\.)?(g|google)\.cn https://www.google.com 302
