[General]
# 配置教程 > https://manual.nssurge.com/book/understanding-surge/cn/
# > 测试超时（秒）
test-timeout = 10
# UDP 优先级
udp-priority = false
# > 国内 测试 URL
internet-test-url = http://www.bing.com
# > 代理测速 URL
proxy-test-url = http://www.gstatic.com/generate_204
# > 自定义 GeoIP 数据库
geoip-maxmind-url = https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb
# > IPv6 支持（默认关闭）
ipv6 = true
# > DNS 服务器
encrypted-dns-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
# DoH 服务器
show-error-page-for-reject = true
# > 当遇到 REJECT 策略时返回错误页
allow-wifi-access = true
http-listen = 0.0.0.0:7890
socks5-listen = 0.0.0.0:1080
# > 允许 Wi-Fi 访问 (仅 iOS，若允许远程访问将「false」改为「true」)
wifi-access-http-port = 7890
# socks5监听端口
wifi-access-socks5-port = 1080
# http
allow-hotspot-access = true
# HTTP 服务端口
wifi-assist = true
# SOCKS5 服务端口
http-api-tls = false
# 允许个人热点访问
http-api-web-dashboard = true
# > 增强版 Wi-Fi 助理
all-hybrid = false
# HTTP-API控制
exclude-simple-hostnames = true
read-etc-hosts = false
loglevel = notify
# > 远程控制器
always-real-ip = *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.logon.battlenet.com.cn, *.logon.battle.net, stun.l.google.com
udp-policy-not-supported-behaviour = reject
# All Hybrid 网络并发
ipv6-vif = disabled
# > 排除简单主机名
use-local-host-item-for-proxy = false
# > 从 /etc/hosts 读取 DNS 记录
# > 日志级别
# > Always Real IP Hosts
# disable-geoip-db-auto-update = true
# > 禁用 GEOIP 自动更新
# 如果没有代理服务器支持 UDP 转发，可修改为「 direct 」或注释下条，但需注意同一目标主机名 TCP 请求与 UDP 请求的源地址不同所造成的隐私及安全风险。
encrypted-dns-skip-cert-verification = true

[Proxy]
🇯🇵lin-trojan = trojan, x.x.x.x, xxxx, password=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx, skip-cert-verify=true
🇯🇵back-trojan = trojan, x.x.x.x, xxxx, password=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx, skip-cert-verify=true
🇯🇵jay-trojan = trojan, x.x.x.x, xxxx, password=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx, skip-cert-verify=true


