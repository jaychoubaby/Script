port: 7890                # HTTP 代理端口
socks-port: 1080          # Socks 端口
mixed-port: 7893          # 混合端口
allow-lan: false          # 禁止局域网连接
bind-address: "127.0.0.1" # 仅监听本机
mode: rule                # 规则模式
log-level: info           # 日志级别
ipv6: false               # IPV6开关
external-controller: 127.0.0.1:9090

# 保存面板中的策略组选择及 fake-ip 缓存
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053  # 使用非特权端口，仅允许本机访问
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.xboxlive.com
    - msftconnecttest.com
    - xbox.*.microsoft.com
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

#========= 建立锚点 =========#

proxies:
  - name: 🇯🇵lin-trojan
    type: trojan
    server: x.x.x.x
    port: xxxx
    password: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    skip-cert-verify: true

  - name: 🇯🇵back-trojan
    type: trojan
    server: x.x.x.x
    port: xxxx
    password: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    skip-cert-verify: true

  - name: 🇯🇵jay-trojan
    type: trojan
    server: x.x.x.x
    port: xxxx
    password: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    skip-cert-verify: true


# 策略组引用
pr:   &a3 {type: select,   proxies: [auto, 🇭🇰香港, 🇯🇵日本, 🇺🇸美国, 🇨🇳台湾, 🇸🇬新加坡, DIRECT] }
p:    &a1 {type: http,     interval: 86400, health-check: {enable: true, url: http://www.gstatic.com/generate_204, interval: 1800} }
auto: &a4 {type: url-test, lazy: true, url: http://www.gstatic.com/generate_204, interval: 900, use: [Sub] }
use:  &a2 {type: select,   use: [Sub] }
c:    &a6 {type: http,     behavior: classical, interval: 86400}
d:    &a5 {type: http,     behavior: domain,    interval: 86400}
i:    &a7 {type: http,     behavior: ipcidr,    interval: 86400}

proxy-providers:
  Sub:
    <<: *a1
    url: https://api.nexconvert.com/sub?target=clash&url=请手动填入你的订阅&emoji=true&list=true&new_name=true&udp=false
    # URL后面填写格式1[单一订阅]: 直接填写你的机场Clash订阅[推荐此种方式，避免订阅泄露]
    # URL后面填写格式2[多个订阅]：https://api.nexconvert.com/sub?target=clash&url=请手动填入你的订阅(多机场订阅用|分割即可)&emoji=true&list=true&new_name=true&udp=false
    path: ./proxy_providers/tmp.yaml

proxy-groups:
# 分流分组
  - {name: OpenAI, type: select, proxies: [🇺🇸美国]}
  - {name: Gemini, type: select, proxies: [🇺🇸美国]}
  - {name: Google, type: select, proxies: [🇺🇸美国]}
  - {name: Claude, type: select, proxies: [🇺🇸美国]}
  - {name: Final, <<: *a3}

# 节点分组
  - {name: auto, <<: *a4, proxies: [🇯🇵lin-trojan, 🇯🇵back-trojan, 🇯🇵jay-trojan]}
  - {name: 🇭🇰香港, <<: *a4, filter: "港|🇭🇰|HK|(?i)Hong"} # a4更改为a2，即为手动选择
  - {name: 🇯🇵日本, <<: *a4, proxies: [🇯🇵lin-trojan, 🇯🇵back-trojan, 🇯🇵jay-trojan], filter: "日|东京|🇯🇵|JP|(?i)Japan"      } # a4更改为a2，即为手动选择
  - {name: 🇨🇳台湾, <<: *a4, filter: "台|湾|🇹🇼|TW|(?i)Taiwan"} # a4更改为a2，即为手动选择
  - {name: 🇺🇸美国, <<: *a4, filter: "美|🇺🇸|US|(?i)States|American"} # a4更改为a2，即为手动选择
  - {name: 🇸🇬新加坡, <<: *a4, filter: "新|坡|🇸🇬|SG|(?i)Singapore"} # a4更改为a2，即为手动选择

